<!doctype html>
<meta charset="utf-8">
<title>Copilot screen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body > * { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
<body>
<script>
  // copilot.py calls show() over the DevTools protocol. Every image is kept decoded, so a slide seen once comes back at once.
  const seen = new Map();
  const isVideo = src => /\.(mp4|mov|m4v|webm)$/i.test(src);

  function load(src) {
    let el = seen.get(src);
    if (!el) {
      el = new Image();
      el.src = src;
      el.ready = el.decode().catch(() => {});
      seen.set(src, el);
    }
    return el;
  }

  async function show(src, upcoming = []) {
    let el;
    if (isVideo(src)) {
      el = Object.assign(document.createElement("video"), { src, autoplay: true, controls: false, playsInline: true });
    } else {
      el = load(src);
      await el.ready;
    }
    document.body.replaceChildren(el);
    upcoming.forEach(load);
    return src;
  }
</script>
</body>
