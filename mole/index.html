<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>The Mole</title>
<link rel="stylesheet" href="mole.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 960px; margin: 0 auto; padding: 56px 32px 80px; display: grid; gap: 48px; }
  h1 { font: 600 56px/1 ui-serif, "New York", Georgia, serif; letter-spacing: -0.03em; margin: 0 0 12px; }
  header p { margin: 0; max-width: 52ch; color: rgb(31 28 26 / .6); text-wrap: pretty; }
  h2 { font: 500 12px/1 -apple-system, system-ui, sans-serif; letter-spacing: .02em; color: rgb(31 28 26 / .5); margin: 0 0 14px; }

  .screen { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; transition: background-color .3s ease; }
  .screen[data-wall="0"] { background-color: #f2531c; }
  .screen[data-wall="1"] { background-color: #1f1c1a; }
  .screen[data-wall="2"] { background-color: #ffffff; box-shadow: inset 0 0 0 1px rgb(31 28 26 / .1); }
  .screen[data-wall="3"] { background-color: #dfe6dc; }
  .screen .mole-bar { position: absolute; left: 50%; bottom: 24px; translate: -50% 0; }

  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .controls button { font: 500 13px/1 -apple-system, system-ui, sans-serif; color: var(--ink); background: rgb(31 28 26 / .05); border: 0; border-radius: 8px; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: background-color .15s ease, color .15s ease, scale .16s var(--ease-out); }
  .controls button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  .controls button:active { scale: .97; }
  kbd { font: 500 11px/1 ui-monospace, monospace; opacity: .5; }

  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .sheet button { all: unset; display: grid; padding: 12px; border-radius: 12px; cursor: pointer; transition: background-color .15s ease; }
  .sheet button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sheet .mole-bar { width: auto; height: auto; padding: 0; flex-direction: column; align-items: stretch; gap: 10px; background: none; box-shadow: none; border-radius: 0; }
  .sheet .mole-fig { align-self: flex-start; width: 132px; height: 128px; margin: 0; }
  .sheet .mole-heard { display: none; }
  .sheet .mole-title > span { white-space: normal; }
  .sheet .mole-text .mole-words { --wy: 0px; }
  .sheet .mole-text .mole-dot { translate: none; }

  @media (hover: hover) and (pointer: fine) {
    .controls button:hover:not([aria-pressed=true]) { background: rgb(31 28 26 / .09); }
    .sheet button:hover { background: rgb(31 28 26 / .04); }
  }
</style>

<main>
  <header>
    <h1>The Mole.</h1>
    <p>Pops out of the overlay bar while the copilot works, says what it understood, and dives back when you have the screen again.</p>
  </header>
  <section>
    <h2>On a screen</h2>
    <div class="screen" data-wall="0"><div id="live"></div></div>
    <div class="controls" id="controls"></div>
  </section>
  <section>
    <h2>States</h2>
    <div class="sheet" id="sheet"></div>
  </section>
</main>

<script src="mole.js"></script>
<script>
  const LINE = "so let's look at the market size";
  const SAMPLES = {
    idle: { heard: "" },
    heard: { title: "I've got it.", heard: LINE },
    working: { title: "Finding slide 7…", heard: LINE },
    ready: { title: "Slide 7 is ready.", heard: LINE },
    unsure: { heard: "open the, um, thing from the offsite" },
    back: { heard: "" },
    thinking: { title: "Thinking…", heard: "show them how the warehouse robot picks" },
    waiting: { title: "Open… what?", heard: "open up, um", timeout: 8000 },
    tunneling: { title: "Step 2 · clicking Search", heard: "search robot grippers on youtube" },
    failed: { title: "Couldn't find “roadmap”.", heard: "pull up the roadmap" },
    hello: { title: "Hi. I'm listening.", heard: "" },
  };
  const KEYS = ["hidden", ...Object.keys(SAMPLES)];

  for (const [state, words] of Object.entries(SAMPLES)) {
    const pick = Object.assign(document.createElement("button"), { onclick: () => show(state) });
    pick.setAttribute("aria-label", `Show ${state} on the screen`);
    const bar = Mole.create(document.createElement("div"));
    bar.el.setAttribute("aria-hidden", "true");
    bar.set(state, words);
    pick.append(bar.el);
    sheet.append(pick);
  }

  const live = Mole.create(document.querySelector("#live"));
  const screen = document.querySelector(".screen");
  let run = 0, slow = 1;
  const wait = ms => new Promise(r => setTimeout(r, ms * slow));

  function show(state) {
    run++;
    live.set(state, SAMPLES[state]);
  }

  async function story() {
    const id = ++run;
    const beat = async (state, words, ms) => { if (id !== run) throw 0; live.set(state, words); await wait(ms); };
    const stream = async (state, text) => {
      const words = text.split(" ");
      for (let i = 1; i <= words.length; i++) await beat(state, { heard: words.slice(0, i).join(" ") }, 140);
    };
    try {
      await beat("idle", { heard: "" }, 500);
      await stream("idle", "okay so the next thing I want to show you is the market size");
      await beat("heard", { title: "I've got it." }, 1000);
      await beat("working", { title: "Finding slide 7…" }, 2200);
      await beat("ready", { title: "Slide 7 is ready." }, 1700);
      await beat("back", { heard: "" }, 1300);
      await beat("hidden", {}, 1500);
      await beat("hello", {}, 1600);
      await beat("idle", { heard: "" }, 600);
      await beat("thinking", { heard: "show them how the warehouse robot picks" }, 1400);
      await beat("tunneling", { title: "Step 1 · opening YouTube" }, 1500);
      await beat("tunneling", { title: "Step 2 · clicking Search" }, 1500);
      await beat("ready", { title: "It's on screen." }, 1500);
      await beat("back", { heard: "" }, 1300);
      await beat("hidden", {}, 1500);
      await beat("idle", { heard: "" }, 400);
      await stream("idle", "and can you open the, um, thing from the offsite");
      await beat("unsure", {}, 2000);
      await beat("back", { heard: "" }, 1300);
      await beat("hidden", {}, 0);
    } catch {}
  }

  function toggleSlow() {
    slow = slow === 1 ? 5 : 1;
    document.documentElement.style.setProperty("--slow", slow);
    Mole.speed = slow === 1 ? 1 : 0.2;
    slowButton.setAttribute("aria-pressed", slow > 1);
  }

  const button = (label, key, onclick) => {
    const b = Object.assign(document.createElement("button"), { onclick });
    b.append(label);
    if (key) b.append(Object.assign(document.createElement("kbd"), { textContent: key }));
    controls.append(b);
    return b;
  };
  KEYS.forEach((state, i) => button(state, i < 10 ? `${i}` : "", () => show(state)));
  button("Play story", "space", story);
  const slowButton = button("Slow-mo", "S", toggleSlow);
  button("Wallpaper", "W", () => (screen.dataset.wall = (+screen.dataset.wall + 1) % 4));

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (KEYS[e.key]) show(KEYS[e.key]);
    else if (e.key === " ") { e.preventDefault(); story(); }
    else if (e.key === "s") toggleSlow();
    else if (e.key === "w") screen.dataset.wall = (+screen.dataset.wall + 1) % 4;
  });

  story();
</script>
