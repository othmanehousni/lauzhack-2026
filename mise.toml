min_version = "2026.11.8"

[tools]
java = "temurin-21"
android-sdk = "23.0"
node = "24"
python = "3.12"
uv = "0.13.9"
"npm:agent-desktop" = { version = "1.3.1", allow_builds = ["agent-desktop"] }

# Mise sets JAVA_HOME and ANDROID_HOME for tasks.
# The Gradle wrapper manages Gradle, Kotlin, Compose, and project dependencies.

[vars]
# Keep these aligned with gradle/libs.versions.toml.
android_api = "36"
android_build_tools = "36.0.0"
android_avd = "lauzhack-2026"
desktop_app = "composeApp/build/compose/binaries/main/app/Moliere.app"
reportlab = "5.1.0"

[env]
ANDROID_AVD_HOME = "{{config_root}}/.android/avd"

[hooks]
postinstall = { task = "setup" }

[bootstrap.packages]
"brew-cask:google-chrome" = { os = "macos", adopt = true }

[tasks.setup]
description = "Set up Android SDK packages, desktop prerequisites, and sample decks"
run = ["mise run android:setup", "mise run desktop:setup"]
run_windows = "mise run android:setup"

[tasks."desktop:requirements"]
description = "Check macOS and Apple's Swift/SDK tools; open their installer if missing"
run = '''
if [ "$(uname -s)" != Darwin ]; then
    echo "The desktop app requires macOS 26 or newer." >&2
    exit 1
fi
os_major=$(sw_vers -productVersion | cut -d. -f1)
if [ "$os_major" -lt 26 ]; then
    echo "The desktop app requires macOS 26 or newer for on-device speech recognition." >&2
    exit 1
fi
if ! xcrun --find swiftc >/dev/null 2>&1; then
    xcode-select --install
    echo "Finish the Command Line Tools installer, then run mise install again." >&2
    exit 1
fi
sdk_major=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
if [ "$sdk_major" -lt 26 ]; then
    echo "Update Xcode Command Line Tools to a macOS 26+ SDK, then run mise install again." >&2
    exit 1
fi
'''

[tasks."desktop:setup"]
description = "Install Chrome and prepare the sample decks on macOS"
raw = true
run = '''
if [ "$(uname -s)" != Darwin ]; then exit 0; fi
mise run desktop:requirements
mise bootstrap packages apply --yes
mise run fixtures
'''

[tasks.fixtures]
description = "Generate the three sample PDF decks in library"
sources = ["fixtures/make_decks.py", "mise.toml"]
outputs = [
  "library/Acme_Company_Overview_2026.pdf",
  "library/Acme_Product_Roadmap.pdf",
  "library/Acme_Q3_2026_Financials.pdf",
]
run = 'uv run --no-project --python python3 --with "reportlab=={{vars.reportlab}}" python fixtures/make_decks.py library'

[tasks."android:setup"]
description = "Install missing Android SDK packages and accept licenses when prompted"
raw = true
run = '''
sdk_root="${ANDROID_HOME:?Run mise install to configure the Android SDK}"
if [ -x "$sdk_root/platform-tools/adb" ] &&
   [ -f "$sdk_root/platforms/android-{{vars.android_api}}/android.jar" ] &&
   [ -x "$sdk_root/build-tools/{{vars.android_build_tools}}/aapt2" ]; then
    exit 0
fi
sdkmanager --licenses
sdkmanager "platform-tools" "platforms;android-{{vars.android_api}}" "build-tools;{{vars.android_build_tools}}"
'''
run_windows = [
  "sdkmanager --licenses",
  'sdkmanager "platform-tools" "platforms;android-{{vars.android_api}}" "build-tools;{{vars.android_build_tools}}"',
]

[tasks."android:emulator:setup"]
description = "Install the optional emulator and create a project-local virtual device"
depends = ["android:setup"]
run = '''
case "$(uname -m)" in
    arm64|aarch64) image_arch=arm64-v8a ;;
    *) image_arch=x86_64 ;;
esac
system_image="system-images;android-{{vars.android_api}};google_apis;$image_arch"
sdkmanager "emulator" "$system_image"
mkdir -p "$ANDROID_AVD_HOME"
if [ ! -f "$ANDROID_AVD_HOME/{{vars.android_avd}}.ini" ]; then
    printf 'no\n' | avdmanager create avd --name "{{vars.android_avd}}" --package "$system_image"
fi
'''

[tasks."android:emulator"]
description = "Start the project Android emulator"
run = '"$ANDROID_HOME/emulator/emulator" -avd "{{vars.android_avd}}"'

[tasks.android]
description = "Build, install, and launch the app on a connected Android device or emulator"
depends = ["android:setup"]
run = [
  "adb get-state",
  "./gradlew :androidApp:assembleDebug",
  "adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk",
  'adb shell am start -n ch.lauzhack.app/.MainActivity',
]
run_windows = [
  "adb get-state",
  "gradlew.bat :androidApp:assembleDebug",
  "adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk",
  'adb shell am start -n ch.lauzhack.app/.MainActivity',
]

[tasks.desktop]
description = "Build and run the packaged Mac app with the sample decks; Ctrl+C quits"
depends = ["desktop:build"]
raw = true
run = 'exec "{{config_root}}/{{vars.desktop_app}}/Contents/MacOS/Moliere" --library "{{config_root}}/library"'

[tasks."desktop:build"]
description = "Build Moliere.app with its native runtime and macOS permission declarations"
depends = ["desktop:requirements", "fixtures"]
run = "./gradlew :composeApp:createDistributable"

[tasks."desktop:demo"]
description = "Run the scripted floater demo without microphone, models, or a VM"
depends = ["desktop:build"]
raw = true
run = 'exec "{{config_root}}/{{vars.desktop_app}}/Contents/MacOS/Moliere" --demo'

[tasks."desktop:typed"]
description = "Type commands instead of speaking, using Chrome on this Mac"
depends = ["desktop:build"]
raw = true
run = 'exec "{{config_root}}/{{vars.desktop_app}}/Contents/MacOS/Moliere" --typed --host --no-history --library "{{config_root}}/library"'

[tasks."vm:setup"]
description = "Install the optional macOS VM provider; VM creation remains a separate step"
depends = ["desktop:requirements"]
raw = true
run = "agent-desktop sandbox install macos"

[tasks."vm:create"]
description = "Create the base VM from a downloaded macOS restore image"
depends = ["vm:setup"]
usage = 'arg "<ipsw>" help="Path to a local macOS restore .ipsw file"'
run = '''
if [ ! -f "${usage_ipsw?}" ]; then
    echo "Restore image not found: ${usage_ipsw?}" >&2
    exit 1
fi
agent-desktop sandbox create base --provider macos --set "ipsw=${usage_ipsw?}"
'''

[tasks."vm:start"]
description = "Open the existing base VM for its macOS Setup Assistant"
run = 'agent-desktop sandbox start base --window --set "title=Molière screen"'

[tasks.build]
description = "Build the packaged Mac app and Android debug APK"
depends = ["android:setup", "desktop:requirements", "fixtures"]
run = "./gradlew :composeApp:createDistributable :androidApp:assembleDebug"
