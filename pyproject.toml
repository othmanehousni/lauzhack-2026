[project]
name = "meeting-copilot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.32",
    "numpy>=2.5.5",
    "opencv-python>=4.10",
    "parakeet-mlx>=0.7.0",
    "pyobjc-framework-quartz>=13.0",
    "pyobjc-framework-Vision>=11",
    "pypdf>=7.1.1",
    "sounddevice>=0.5.6",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "reportlab>=5.1.0",
]
eval = [
    "mlx-whisper>=0.4",
]
